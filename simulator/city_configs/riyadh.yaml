# Configuration for Riyadh (Hot/Dry)

climate_name: "riyadh"

# Approximate average monthly temperatures (°C) - Refine with real data if possible
monthly_temps:
  1: 15.0
  2: 17.0
  3: 21.0
  4: 26.0
  5: 31.0
  6: 34.0
  7: 35.0
  8: 34.0
  9: 32.0
  10: 27.0
  11: 22.0
  12: 17.0

# Approximate monthly rain probability (%) - Refine with real data if possible
# Represents the chance of scheduled rain starting in any given hour (very low)
monthly_rain_prob:
  1: 10
  2: 10
  3: 8
  4: 5
  5: 2
  6: 0
  7: 0
  8: 0
  9: 2
  10: 5
  11: 8
  12: 10

# Default external conditions (can be made dynamic later if needed)
day_start_hour: 5
default_outside_rh: 35.0 # Low humidity typical for Riyadh

# Default initial state (used if scenario doesn't override)
default_init_temp: 25.0
default_init_rh: 45.0
default_init_sm: 40.0
default_init_rain_tank_l: 50.0

# Default target ranges (used if scenario doesn't override)
# Suitable for warmer climate crops, potentially wider RH band
default_target_t_c_min: 22.0
default_target_t_c_max: 28.0
default_target_rh_min: 40.0
default_target_rh_max: 55.0
default_target_sm_min: 35.0
default_target_sm_max: 50.0